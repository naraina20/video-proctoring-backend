name: Build and Deploy Video Proctoring Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Short Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Images
        run: |
          # Build with unique short SHA tag
          docker build -t narainad308/video-proctoring-backend:${{ steps.vars.outputs.sha_short }} .
          docker push narainad308/video-proctoring-backend:${{ steps.vars.outputs.sha_short }}
          
          # Also tag as latest
          docker tag narainad308/video-proctoring-backend:${{ steps.vars.outputs.sha_short }} narainad308/video-proctoring-backend:latest
          docker push narainad308/video-proctoring-backend:latest

      # Creates the directory on the host VM before copying files
      - name: Ensure deployment directory exists on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/asus/video-proctoring-backend

      # Transfers the docker-compose.yml file straight from your repository code
      - name: Push docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/asus/video-proctoring-backend/"

      # Executes the containerized infrastructure on your server
      - name: SSH and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_TAG: ${{ steps.vars.outputs.sha_short }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: TARGET_TAG
          script: |
            set -e # <--- If any line below this fails, GitHub will immediately catch it!
            
            cd /home/asus/video-proctoring-backend

            # Execute Docker Compose using the fresh file and the unique Git SHA
            sudo TAG=$TARGET_TAG docker compose pull
            sudo TAG=$TARGET_TAG docker compose up -d --force-recreate
            
            # Wipes out stale image layers to keep your VM storage completely clear
            sudo docker image prune -af
